name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh YouTube Viewer"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "api/**"
      - "services/**"
      - "front/**"
      - "data/feed.json"
      - "data/video_meta.json"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-space.yml"

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing required GitHub Secret: HF_TOKEN"
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO_ID" ]; then
            echo "::error::Missing required GitHub Secret: HF_SPACE_REPO_ID"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Run frontend tests
        working-directory: front
        run: npm run test

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=1,<2"

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time

          import httpx
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          repo_id = os.environ["HF_SPACE_REPO_ID"].strip()
          token = os.environ["HF_TOKEN"].strip()
          api = HfApi(token=token)
          retryable_errors = (json.JSONDecodeError, httpx.HTTPError, HfHubHTTPError)
          max_attempts = 3

          for attempt in range(1, max_attempts + 1):
              try:
                  print(f"Upload attempt {attempt}/{max_attempts}")
                  api.upload_folder(
                      folder_path=".",
                      repo_id=repo_id,
                      repo_type="space",
                      ignore_patterns=[
                          ".git/*",
                          ".github/*",
                          ".venv/*",
                          "__pycache__/*",
                          "front/node_modules/*",
                          ".pytest_cache/*",
                          ".playwright-mcp/*",
                          "key.txt",
                          ".env",
                          "docs/*",
                          "templates/*",
                          "static/*",
                      ],
                      commit_message="Deploy YouTube Viewer",
                  )
                  print("Upload completed")
                  break
              except retryable_errors as exc:
                  if attempt == max_attempts:
                      print(f"Upload failed after {max_attempts} attempts: {exc!r}")
                      raise

                  wait_seconds = 15 * attempt
                  print(f"Upload failed with retryable error: {exc!r}")
                  print(f"Retrying in {wait_seconds} seconds...")
                  time.sleep(wait_seconds)
          PY
