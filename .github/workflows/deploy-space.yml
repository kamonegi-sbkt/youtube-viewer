name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "services/**"
      - "front/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-space.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing required GitHub Secret: HF_TOKEN"
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO_ID" ]; then
            echo "::error::Missing required GitHub Secret: HF_SPACE_REPO_ID"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Run frontend tests
        working-directory: front
        run: npm run test

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          deploy_dir="$(mktemp -d)"
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "front/node_modules/" \
            --exclude ".pytest_cache/" \
            --exclude ".playwright-mcp/" \
            --exclude "key.txt" \
            --exclude ".env" \
            --exclude "/docs/" \
            --exclude "/templates/" \
            --exclude "/static/" \
            ./ "$deploy_dir/"

          if [ ! -f "$deploy_dir/front/dist/index.html" ]; then
            echo "::error::Missing frontend build artifact: front/dist/index.html"
            exit 1
          fi
          if [ ! -f "$deploy_dir/front/dist/static/manifest.json" ]; then
            echo "::error::Missing frontend static artifact: front/dist/static/manifest.json"
            exit 1
          fi

          cat > "$RUNNER_TEMP/hf-askpass.sh" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) echo "hf_token" ;;
            *Password*) echo "$HF_TOKEN" ;;
            *) echo "" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/hf-askpass.sh"

          cd "$deploy_dir"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git add -f front/dist
          git ls-files --error-unmatch front/dist/index.html
          git ls-files --error-unmatch front/dist/static/manifest.json
          git commit -m "Deploy YouTube Viewer"
          git remote add origin "https://huggingface.co/spaces/${HF_SPACE_REPO_ID}"
          GIT_ASKPASS="$RUNNER_TEMP/hf-askpass.sh" GIT_TERMINAL_PROMPT=0 git push --force origin main
