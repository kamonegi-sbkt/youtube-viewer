{% extends "base.html" %}
{% block content %}
<header class="topbar">
  <div class="topbar-title">
    <span class="logo-dot"></span>
    <span>My YouTube</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="feed" role="tab" aria-selected="true">新着</button>
    <button class="tab" data-tab="later" role="tab" aria-selected="false">
      あとで<span class="tab-count" id="later-count" hidden>0</span>
    </button>
  </nav>
  <div class="topbar-actions">
    <a class="topbar-btn" href="{{ url_for('refresh') }}" aria-label="再読み込み" title="再読み込み">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
    </a>
    <a class="topbar-btn" href="{{ url_for('logout') }}" aria-label="ログアウト" title="ログアウト">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</header>

<main class="grid" id="grid-feed" data-tab-panel="feed">
  {% for v in videos %}
  <article class="card"
           data-video-id="{{ v.video_id }}"
           data-title="{{ v.title }}"
           data-channel="{{ v.channel_title }}"
           data-thumbnail="{{ v.thumbnail }}"
           data-published="{{ v.published_iso }}">
    <div class="thumb">
      <img src="{{ v.thumbnail }}" alt="" loading="lazy">
      <div class="play-overlay">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="play-overlay-mini" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <button class="bookmark-btn" aria-label="あとで見るに追加" aria-pressed="false">
        <svg class="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
    </div>
    <div class="meta">
      <div class="title">{{ v.title }}</div>
      <div class="sub">
        <span class="channel">{{ v.channel_title }}</span>
        <span class="dot">•</span>
        <span class="time">{{ v.rel_time }}</span>
      </div>
    </div>
  </article>
  {% else %}
  <div class="empty">
    <p>動画を取得できませんでした。</p>
    <p><a href="{{ url_for('refresh') }}">再読み込み</a></p>
  </div>
  {% endfor %}
</main>

<main class="grid" id="grid-later" data-tab-panel="later" hidden></main>

<div class="empty" id="later-empty" data-tab-panel="later" hidden>
  <p>🔖 あとで見る動画はまだありません</p>
  <p class="empty-hint">カードの右上のブックマークをタップして追加</p>
</div>

<div id="player-overlay" class="player-overlay" hidden>
  <div class="player-frame">
    <div class="player-controls">
      <button class="player-minimize" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button class="player-expand" aria-label="全画面に戻す" title="全画面に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button class="player-close" aria-label="閉じる" title="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="player-iframe-wrap">
      <iframe id="player-iframe"
              src=""
              title="YouTube"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
              allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
