<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* Keep video length visible even if a mobile browser reuses an older stylesheet. */
.thumb .video-length-badge {
  position: absolute;
  right: 6px;
  bottom: 6px;
  z-index: 4;
  padding: 3px 4px;
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  color: #fff;
  background: rgba(0, 0, 0, 0.86);
  border-radius: 4px;
  pointer-events: none;
}
</style>
<title>{% block title %}My YouTube Viewer{% endblock %}</title>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
